<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Portfolio CMS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #e5e5e5; height: 100vh; display: flex; flex-direction: column; }

/* ── Login ── */
#login { display: flex; align-items: center; justify-content: center; flex: 1; }
.login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 32px; width: 340px; }
.login-box h2 { font-size: 18px; margin-bottom: 24px; color: #fff; }
.login-box input { width: 100%; padding: 10px 12px; background: #111; border: 1px solid #333; border-radius: 6px; color: #e5e5e5; font-size: 14px; margin-bottom: 12px; outline: none; }
.login-box input:focus { border-color: #555; }
.btn { width: 100%; padding: 10px; background: #e5e5e5; color: #000; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn:hover { background: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.err { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

/* ── Editor ── */
#editor { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
.topbar span { font-size: 14px; font-weight: 600; color: #fff; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
#status { font-size: 13px; color: #888; }
#status.ok { color: #4ade80; }
#status.err { color: #f87171; }
.save-btn { padding: 8px 20px; background: #4ade80; color: #000; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
.save-btn:hover { background: #86efac; }
.save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.logout-btn { padding: 8px 14px; background: transparent; color: #888; border: 1px solid #333; border-radius: 6px; font-size: 13px; cursor: pointer; }
.logout-btn:hover { color: #e5e5e5; border-color: #555; }
textarea { flex: 1; background: #0a0a0a; color: #d4d4d4; border: none; padding: 20px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; }
.hint { padding: 8px 20px; background: #111; border-top: 1px solid #1e1e1e; font-size: 12px; color: #555; }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-box">
    <h2>Portfolio CMS</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username"/>
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password"/>
    <button class="btn" id="login-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- Editor -->
<div id="editor">
  <div class="topbar">
    <span>Portfolio Data</span>
    <div class="topbar-actions">
      <span id="status"></span>
      <button class="save-btn" id="save-btn" onclick="doSave()">Save</button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <textarea id="json-editor" spellcheck="false"></textarea>
  <div class="hint">Edit the JSON above and click Save. Invalid JSON will not be saved.</div>
</div>

<script>
let token = localStorage.getItem('cms-token');

async function doLogin() {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-err');
  btn.disabled = true; btn.textContent = 'Signing in...';
  errEl.style.display = 'none';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pass').value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');
    token = d.token;
    localStorage.setItem('cms-token', token);
    showEditor();
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}

async function showEditor() {
  setStatus('Loading...');
  document.getElementById('login').style.display = 'none';
  document.getElementById('editor').style.display = 'flex';
  try {
    const r = await fetch('/api/cms/data', { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) { doLogout(); return; }
    const d = await r.json();
    document.getElementById('json-editor').value = JSON.stringify(d, null, 2);
    setStatus('Loaded ✓', 'ok');
  } catch(e) { setStatus('Failed to load', 'err'); }
}

async function doSave() {
  const raw = document.getElementById('json-editor').value;
  let parsed;
  try { parsed = JSON.parse(raw); } catch(e) { setStatus('Invalid JSON — fix errors first', 'err'); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  setStatus('Saving...');
  try {
    const r = await fetch('/api/cms/data', {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(parsed)
    });
    if (r.status === 401) { doLogout(); return; }
    if (!r.ok) throw new Error((await r.json()).error);
    setStatus('Saved ✓', 'ok');
  } catch(e) { setStatus(e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = 'Save'; }
}

function doLogout() {
  localStorage.removeItem('cms-token'); token = null;
  document.getElementById('editor').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = cls || '';
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); doSave(); }
});

document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

if (token) showEditor();
</script>
</body>
</html>
