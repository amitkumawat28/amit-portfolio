<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Portfolio CMS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f0f;color:#e5e5e5;height:100vh;display:flex;flex-direction:column}
/* Login */
#login{display:flex;align-items:center;justify-content:center;flex:1}
.lbox{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:32px;width:340px}
.lbox h2{font-size:18px;margin-bottom:24px;color:#fff}
.lbox input{width:100%;padding:10px 12px;background:#111;border:1px solid #333;border-radius:6px;color:#e5e5e5;font-size:14px;margin-bottom:12px;outline:none}
.lbox input:focus{border-color:#555}
.lbtn{width:100%;padding:10px;background:#e5e5e5;color:#000;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.lbtn:hover{background:#fff}
.lbtn:disabled{opacity:.5;cursor:not-allowed}
.lerr{color:#f87171;font-size:13px;margin-top:10px;display:none}
/* Shell */
#app{display:none;flex-direction:column;flex:1;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;height:52px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:4px}
.tab{padding:8px 14px;font-size:13px;font-weight:500;color:#888;border:none;background:none;cursor:pointer;border-radius:6px;white-space:nowrap}
.tab:hover{color:#e5e5e5;background:#2a2a2a}
.tab.active{color:#fff;background:#2a2a2a}
.topbar-right{display:flex;align-items:center;gap:10px}
#status{font-size:13px;color:#888}
#status.ok{color:#4ade80}
#status.err{color:#f87171}
.save-btn{padding:7px 18px;background:#4ade80;color:#000;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
.save-btn:hover{background:#86efac}
.save-btn:disabled{opacity:.5;cursor:not-allowed}
.out-btn{padding:7px 12px;background:transparent;color:#888;border:1px solid #333;border-radius:6px;font-size:13px;cursor:pointer}
.out-btn:hover{color:#e5e5e5;border-color:#555}
/* Content */
#content{flex:1;overflow-y:auto;padding:24px}
.panel{display:none}
.panel.active{display:block}
/* Forms */
.section{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:20px;margin-bottom:16px}
.section h3{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row.full{grid-template-columns:1fr}
label{display:block;font-size:12px;color:#888;margin-bottom:4px}
input[type=text],input[type=email],input[type=url],input[type=number],textarea,select{width:100%;padding:8px 10px;background:#111;border:1px solid #2a2a2a;border-radius:6px;color:#e5e5e5;font-size:13px;outline:none;font-family:inherit}
input[type=text]:focus,input[type=email]:focus,input[type=url]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:#444}
textarea{resize:vertical;min-height:80px;line-height:1.5}
/* Cards / Lists */
.card{background:#111;border:1px solid #2a2a2a;border-radius:7px;padding:14px;margin-bottom:10px;position:relative}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-head strong{font-size:13px;color:#ccc}
.del-btn{padding:4px 10px;background:transparent;color:#f87171;border:1px solid #3a1a1a;border-radius:5px;font-size:12px;cursor:pointer}
.del-btn:hover{background:#3a1a1a}
.add-btn{width:100%;padding:9px;background:transparent;border:1px dashed #333;border-radius:6px;color:#666;font-size:13px;cursor:pointer;margin-top:6px}
.add-btn:hover{border-color:#555;color:#aaa}
/* Drag handle */
.drag-handle{cursor:grab;color:#444;padding:2px 6px;font-size:18px;line-height:1;user-select:none}
.drag-handle:hover{color:#888}
.section.dragging{opacity:.4}
.section.drag-over{border-color:#4ade80}
/* Tags input */
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:#111;border:1px solid #2a2a2a;border-radius:6px;min-height:38px;align-items:center;cursor:text}
.tags-wrap:focus-within{border-color:#444}
.tag-chip{background:#2a2a2a;color:#ccc;font-size:12px;padding:3px 8px;border-radius:4px;display:flex;align-items:center;gap:4px}
.tag-chip button{background:none;border:none;color:#888;cursor:pointer;font-size:14px;line-height:1;padding:0}
.tags-wrap input{background:none;border:none;outline:none;color:#e5e5e5;font-size:13px;flex:1;min-width:80px}
/* Raw JSON */
#json-wrap{display:flex;flex-direction:column;height:calc(100vh - 100px)}
#json-editor{flex:1;background:#0a0a0a;color:#d4d4d4;border:1px solid #2a2a2a;border-radius:8px;padding:16px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:12.5px;line-height:1.6;resize:none;outline:none;width:100%}
/* Responses */
.resp-block{background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:12px;margin-bottom:8px}
.resp-block-type{font-size:11px;color:#666;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="lbox">
    <h2>Portfolio CMS</h2>
    <input id="em" type="email" placeholder="Email" autocomplete="username"/>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password"/>
    <button class="lbtn" id="lbtn" onclick="doLogin()">Sign in</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="tab active" onclick="switchTab('identity')">Identity</button>
      <button class="tab" onclick="switchTab('projects')">Projects</button>
      <button class="tab" onclick="switchTab('suggestions')">Suggestions</button>
      <button class="tab" onclick="switchTab('conversations')">Conversations</button>
      <button class="tab" onclick="switchTab('responses')">Responses</button>
      <button class="tab" onclick="switchTab('json')">JSON</button>
    </div>
    <div class="topbar-right">
      <span id="status"></span>
      <button class="save-btn" id="sbtn" onclick="doSave()">Save</button>
      <button class="out-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div id="content">

    <!-- IDENTITY -->
    <div class="panel active" id="p-identity">
      <div class="section">
        <h3>Basic Info</h3>
        <div class="row">
          <div><label>Name</label><input type="text" id="i-name"/></div>
          <div><label>Handle</label><input type="text" id="i-handle"/></div>
        </div>
        <div class="row">
          <div><label>Role / Title</label><input type="text" id="i-role"/></div>
          <div><label>Location</label><input type="text" id="i-location"/></div>
        </div>
        <div class="row">
          <div><label>Years of experience</label><input type="number" id="i-years"/></div>
          <div><label>CV file path</label><input type="text" id="i-cv"/></div>
        </div>
        <div class="row full">
          <div><label>Tagline</label><textarea id="i-tagline" rows="2"></textarea></div>
        </div>
      </div>
      <div class="section">
        <h3>Links</h3>
        <div class="row">
          <div><label>Email</label><input type="email" id="i-email"/></div>
          <div><label>LinkedIn URL</label><input type="url" id="i-linkedin"/></div>
        </div>
        <div class="row">
          <div><label>GitHub URL</label><input type="url" id="i-github"/></div>
        </div>
      </div>
    </div>

    <!-- PROJECTS -->
    <div class="panel" id="p-projects">
      <div id="projects-list"></div>
      <button class="add-btn" onclick="addProject()">+ Add project</button>
    </div>

    <!-- SUGGESTIONS -->
    <div class="panel" id="p-suggestions">
      <div id="sugg-list"></div>
      <button class="add-btn" onclick="addSuggestion()">+ Add suggestion</button>
    </div>

    <!-- CONVERSATIONS -->
    <div class="panel" id="p-conversations">
      <div id="conv-list"></div>
      <button class="add-btn" onclick="addConversation()">+ Add conversation</button>
    </div>

    <!-- RESPONSES -->
    <div class="panel" id="p-responses">
      <div class="section" style="margin-bottom:8px">
        <p style="font-size:13px;color:#888">Edit the text content of each response block. For full structural changes use the JSON tab.</p>
      </div>
      <div id="resp-list"></div>
    </div>

    <!-- JSON -->
    <div class="panel" id="p-json">
      <div id="json-wrap">
        <textarea id="json-editor" spellcheck="false"></textarea>
      </div>
    </div>

  </div>
</div>

<script>
let token = localStorage.getItem('cms-token');
let DATA = {};
let activeTab = 'identity';

/* ── Auth ── */
async function doLogin(){
  const btn=document.getElementById('lbtn'), err=document.getElementById('lerr');
  btn.disabled=true; btn.textContent='Signing in…'; err.style.display='none';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('em').value,password:document.getElementById('pw').value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Login failed');
    token=d.token; localStorage.setItem('cms-token',token);
    await loadAndShow();
  }catch(e){err.textContent=e.message;err.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Sign in';}
}
function doLogout(){localStorage.removeItem('cms-token');token=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}

/* ── Load ── */
async function loadAndShow(){
  setStatus('Loading…');
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  try{
    const r=await fetch('/api/cms/data',{headers:{Authorization:'Bearer '+token}});
    if(r.status===401){doLogout();return;}
    DATA=await r.json();
    renderAll();
    setStatus('Loaded ✓','ok');
  }catch(e){setStatus('Failed to load','err');}
}

function renderAll(){
  renderIdentity();
  renderProjects();
  renderSuggestions();
  renderConversations();
  renderResponses();
  document.getElementById('json-editor').value=JSON.stringify(DATA,null,2);
}

/* ── Save ── */
async function doSave(){
  collectAll();
  const btn=document.getElementById('sbtn');
  btn.disabled=true; btn.textContent='Saving…'; setStatus('Saving…');
  try{
    const r=await fetch('/api/cms/data',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(DATA)});
    if(r.status===401){doLogout();return;}
    if(!r.ok) throw new Error((await r.json()).error);
    setStatus('Saved ✓','ok');
    // refresh JSON tab
    document.getElementById('json-editor').value=JSON.stringify(DATA,null,2);
  }catch(e){setStatus(e.message,'err');}
  finally{btn.disabled=false;btn.textContent='Save';}
}

function collectAll(){
  // If JSON tab is active, parse from there
  if(activeTab==='json'){
    try{DATA=JSON.parse(document.getElementById('json-editor').value);}catch(e){setStatus('Invalid JSON','err');throw e;}
    return;
  }
  collectIdentity();
  collectProjects();
  collectSuggestions();
  collectConversations();
  collectResponses();
}

/* ── Tabs ── */
function switchTab(t){
  activeTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+t+"'")));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+t).classList.add('active');
}

function setStatus(msg,cls){const el=document.getElementById('status');el.textContent=msg;el.className=cls||'';}

/* ══ IDENTITY ══ */
function renderIdentity(){
  const id=DATA.identity||{};
  document.getElementById('i-name').value=id.name||'';
  document.getElementById('i-handle').value=id.handle||'';
  document.getElementById('i-role').value=id.role||'';
  document.getElementById('i-location').value=id.location||'';
  document.getElementById('i-years').value=id.years||'';
  document.getElementById('i-cv').value=id.cvPath||'';
  document.getElementById('i-tagline').value=id.tagline||'';
  document.getElementById('i-email').value=(id.links||{}).email||'';
  document.getElementById('i-linkedin').value=(id.links||{}).linkedin||'';
  document.getElementById('i-github').value=(id.links||{}).github||'';
}
function collectIdentity(){
  DATA.identity={
    name:v('i-name'),handle:v('i-handle'),role:v('i-role'),location:v('i-location'),
    years:parseInt(v('i-years'))||0,tagline:v('i-tagline'),cvPath:v('i-cv'),
    links:{email:v('i-email'),linkedin:v('i-linkedin'),github:v('i-github')}
  };
}

/* ══ PROJECTS ══ */
let dragSrc = null;
function renderProjects(){
  const el=document.getElementById('projects-list');
  el.innerHTML='';
  (DATA.projects||[]).forEach((p,i)=>{
    el.insertAdjacentHTML('beforeend',`
    <div class="section" id="proj-${i}" draggable="true" ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event,${i})" ondrop="onDrop(event,${i})" ondragend="onDragEnd()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="drag-handle" title="Drag to reorder">⠿</span>
          <strong style="font-size:14px;color:#ccc">${p.name||'New project'}</strong>
        </div>
        <button class="del-btn" onclick="deleteProject(${i})">Remove</button>
      </div>
      <div class="row">
        <div><label>ID (slug)</label><input type="text" class="pf" data-f="id" data-i="${i}" value="${esc(p.id)}"/></div>
        <div><label>Name</label><input type="text" class="pf" data-f="name" data-i="${i}" value="${esc(p.name)}" oninput="updateProjectTitle(${i},this.value)"/></div>
      </div>
      <div class="row">
        <div><label>Tag / Category</label><input type="text" class="pf" data-f="tag" data-i="${i}" value="${esc(p.tag)}"/></div>
        <div><label>Link (optional)</label><input type="url" class="pf" data-f="link" data-i="${i}" value="${esc(p.link||'')}"/></div>
      </div>
      <div class="row full"><div><label>Blurb</label><textarea class="pf" data-f="blurb" data-i="${i}" rows="2">${esc(p.blurb)}</textarea></div></div>
      <div class="row full"><div>
        <label>Stack (press Enter to add)</label>
        <div class="tags-wrap" id="stack-${i}">${renderTags(p.stack||[],i,'stack')}<input type="text" placeholder="Add tag…" onkeydown="addTag(event,${i},'stack')"/></div>
      </div></div>
      <div class="row full"><div>
        <label>Highlights (one per line)</label>
        <textarea class="pf" data-f="highlights" data-i="${i}" rows="4">${(p.highlights||[]).join('\n')}</textarea>
      </div></div>
    </div>`);
  });
}
function renderTags(tags,idx,field){return tags.map((t,ti)=>`<span class="tag-chip">${esc(t)}<button onclick="removeTag(${idx},'${field}',${ti})">×</button></span>`).join('');}
function addTag(e,idx,field){
  if(e.key!=='Enter') return; e.preventDefault();
  const val=e.target.value.trim(); if(!val) return;
  if(field==='stack') DATA.projects[idx].stack.push(val);
  e.target.value='';
  renderProjects();
}
function removeTag(idx,field,ti){
  if(field==='stack') DATA.projects[idx].stack.splice(ti,1);
  renderProjects();
}
function updateProjectTitle(i,val){const h=document.querySelector(`#proj-${i} strong`);if(h)h.textContent=val||'New project';}
function onDragStart(e,i){collectProjects();dragSrc=i;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragOver(e,i){e.preventDefault();if(dragSrc===i)return;document.querySelectorAll('.section').forEach(s=>s.classList.remove('drag-over'));e.currentTarget.classList.add('drag-over');}
function onDrop(e,i){e.preventDefault();if(dragSrc===null||dragSrc===i)return;const moved=DATA.projects.splice(dragSrc,1)[0];DATA.projects.splice(i,0,moved);dragSrc=null;renderProjects();}
function onDragEnd(){dragSrc=null;document.querySelectorAll('.section').forEach(s=>s.classList.remove('dragging','drag-over'));}
function collectProjects(){
  DATA.projects=(DATA.projects||[]).map((p,i)=>{
    const get=(f)=>{const el=document.querySelector(`.pf[data-f="${f}"][data-i="${i}"]`);return el?el.value:p[f];};
    const hl=get('highlights').split('\n').map(s=>s.trim()).filter(Boolean);
    return{...p,id:get('id'),name:get('name'),tag:get('tag'),blurb:get('blurb'),link:get('link')||null,highlights:hl};
  });
}
function addProject(){
  DATA.projects.push({id:'new-project',name:'New Project',tag:'',blurb:'',stack:[],highlights:[],link:null});
  renderProjects();
}
function deleteProject(i){if(confirm('Delete this project?')){DATA.projects.splice(i,1);renderProjects();}}

/* ══ SUGGESTIONS ══ */
function renderSuggestions(){
  const el=document.getElementById('sugg-list');
  el.innerHTML='';
  (DATA.suggestions||[]).forEach((s,i)=>{
    el.insertAdjacentHTML('beforeend',`
    <div class="card">
      <div class="card-head"><strong>Suggestion ${i+1}</strong><button class="del-btn" onclick="deleteSugg(${i})">Remove</button></div>
      <div class="row">
        <div><label>Label (button text)</label><input type="text" id="sl-${i}" value="${esc(s.label)}"/></div>
        <div><label>Icon</label><input type="text" id="si-${i}" value="${esc(s.icon)}" placeholder="spark, folder, user, wrench…"/></div>
      </div>
      <div><label>Prompt (sent on click)</label><input type="text" id="sp-${i}" value="${esc(s.prompt)}"/></div>
    </div>`);
  });
}
function collectSuggestions(){
  DATA.suggestions=(DATA.suggestions||[]).map((s,i)=>({icon:v('si-'+i),label:v('sl-'+i),prompt:v('sp-'+i)}));
}
function addSuggestion(){DATA.suggestions.push({icon:'spark',label:'',prompt:''});renderSuggestions();}
function deleteSugg(i){DATA.suggestions.splice(i,1);renderSuggestions();}

/* ══ CONVERSATIONS ══ */
function renderConversations(){
  const el=document.getElementById('conv-list');
  el.innerHTML='';
  (DATA.conversations||[]).forEach((c,i)=>{
    el.insertAdjacentHTML('beforeend',`
    <div class="card">
      <div class="card-head"><strong>${esc(c.title)||'Conversation '+i}</strong><button class="del-btn" onclick="deleteConv(${i})">Remove</button></div>
      <div class="row">
        <div><label>ID (slug)</label><input type="text" id="cid-${i}" value="${esc(c.id)}"/></div>
        <div><label>Icon</label><input type="text" id="cic-${i}" value="${esc(c.icon)}"/></div>
      </div>
      <div class="row">
        <div><label>Title</label><input type="text" id="ct-${i}" value="${esc(c.title)}"/></div>
        <div><label>Preview text</label><input type="text" id="cp-${i}" value="${esc(c.preview)}"/></div>
      </div>
    </div>`);
  });
}
function collectConversations(){
  DATA.conversations=(DATA.conversations||[]).map((c,i)=>({id:v('cid-'+i),title:v('ct-'+i),preview:v('cp-'+i),icon:v('cic-'+i)}));
}
function addConversation(){DATA.conversations.push({id:'new',title:'',preview:'',icon:'user'});renderConversations();}
function deleteConv(i){DATA.conversations.splice(i,1);renderConversations();}

/* ══ RESPONSES ══ */
function renderResponses(){
  const el=document.getElementById('resp-list');
  el.innerHTML='';
  Object.keys(DATA.responses||{}).forEach(key=>{
    const blocks=DATA.responses[key];
    let blocksHtml='';
    blocks.forEach((b,bi)=>{
      if(b.type==='text'){
        blocksHtml+=`<div class="resp-block"><div class="resp-block-type">text</div><textarea id="rb-${key}-${bi}" rows="3">${esc(b.content)}</textarea></div>`;
      } else if(b.type==='callout'){
        blocksHtml+=`<div class="resp-block"><div class="resp-block-type">callout</div>
          <div class="row"><div><label>Title</label><input type="text" id="rb-${key}-${bi}-title" value="${esc(b.title)}"/></div>
          <div><label>Tone</label><input type="text" id="rb-${key}-${bi}-tone" value="${esc(b.tone)}"/></div></div>
          <label>Content</label><textarea id="rb-${key}-${bi}-content" rows="2">${esc(b.content)}</textarea></div>`;
      } else if(b.type==='list'){
        blocksHtml+=`<div class="resp-block"><div class="resp-block-type">list (one item per line)</div><textarea id="rb-${key}-${bi}" rows="5">${esc((b.items||[]).join('\n'))}</textarea></div>`;
      } else if(b.type==='timeline'){
        const rows=(b.items||[]).map(it=>`${it.period} | ${it.role} | ${it.detail}`).join('\n');
        blocksHtml+=`<div class="resp-block"><div class="resp-block-type">timeline — format: Period | Role | Detail</div><textarea id="rb-${key}-${bi}" rows="${Math.max(3,(b.items||[]).length+1)}">${esc(rows)}</textarea></div>`;
      } else if(b.type==='skillGroups'){
        const rows=(b.groups||[]).map(g=>`${g.name} | ${g.level} | ${(g.items||[]).join(', ')}`).join('\n');
        blocksHtml+=`<div class="resp-block"><div class="resp-block-type">skill groups — format: Name | Level(0-100) | Item1, Item2…</div><textarea id="rb-${key}-${bi}" rows="${Math.max(3,(b.groups||[]).length+1)}">${esc(rows)}</textarea></div>`;
      } else {
        blocksHtml+=`<div class="resp-block"><div class="resp-block-type">${b.type} (auto)</div><p style="font-size:12px;color:#555">Rendered automatically — edit in JSON tab if needed.</p></div>`;
      }
    });
    el.insertAdjacentHTML('beforeend',`
    <div class="section">
      <h3>${key}</h3>
      ${blocksHtml}
    </div>`);
  });
}
function collectResponses(){
  Object.keys(DATA.responses||{}).forEach(key=>{
    DATA.responses[key].forEach((b,bi)=>{
      if(b.type==='text'){
        const el=document.getElementById(`rb-${key}-${bi}`);
        if(el) b.content=el.value;
      } else if(b.type==='callout'){
        const t=document.getElementById(`rb-${key}-${bi}-title`);
        const c=document.getElementById(`rb-${key}-${bi}-content`);
        const tn=document.getElementById(`rb-${key}-${bi}-tone`);
        if(t) b.title=t.value;
        if(c) b.content=c.value;
        if(tn) b.tone=tn.value;
      } else if(b.type==='list'){
        const el=document.getElementById(`rb-${key}-${bi}`);
        if(el) b.items=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
      } else if(b.type==='timeline'){
        const el=document.getElementById(`rb-${key}-${bi}`);
        if(el) b.items=el.value.split('\n').map(s=>s.trim()).filter(Boolean).map(row=>{
          const[period,role,...rest]=row.split('|').map(x=>x.trim());
          return{period:period||'',role:role||'',detail:rest.join('|').trim()||''};
        });
      } else if(b.type==='skillGroups'){
        const el=document.getElementById(`rb-${key}-${bi}`);
        if(el) b.groups=el.value.split('\n').map(s=>s.trim()).filter(Boolean).map(row=>{
          const[name,level,...rest]=row.split('|').map(x=>x.trim());
          return{name:name||'',level:parseInt(level)||0,items:rest.join('|').split(',').map(x=>x.trim()).filter(Boolean)};
        });
      }
    });
  });
}

/* ── Utils ── */
function v(id){const el=document.getElementById(id);return el?el.value:'';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── Keyboard shortcut ── */
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();doSave();}});

/* ── Boot ── */
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(token) loadAndShow();
</script>
